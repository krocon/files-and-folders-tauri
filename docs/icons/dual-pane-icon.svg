<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Files and Folders</title>
  <defs>
    <!-- stark abgerundete Ecken -->
    <clipPath id="body">
      <rect x="75" y="75" width="874" height="874" rx="280" ry="280"/>
    </clipPath>
  </defs>
  <g clip-path="url(#body)">
    <!-- linke Seite -->
    <rect x="0" y="0" width="512" height="1024" fill="#0070f0"/>
    <!-- rechte Seite -->
    <rect x="512" y="0" width="512" height="1024" fill="#007eff"/>
    <!-- Header-Balken -->
    <rect x="0" y="0" width="1024" height="260" fill="#a8e3fc"/>
  </g>

  <!--
    „FF“-Logo aus docs/logo/ff-white.svg (4,5 × 4 Einheiten).
    Verschieben:  x, y      = linke obere Ecke in Pixeln
    Größe:        width, height im Verhältnis 4,5 : 4 lassen (z. B. 450 × 400, 360 × 320, 540 × 480)
    Mittig:       x = 512 − width / 2;  y = gewünschte Mitte − height / 2
    Jetzt: 450 × 400, mittig im blauen Teil (Mitte x 512, y 605).
    stroke-width 0.02 (≈ 2 px bei 450 breit) schließt die Fugen zwischen den Teilen; Farbe = fill.
  -->
  <svg x="287" y="405" width="450" height="400" viewBox="0 0 4.5 4" fill="#fff" stroke="#fff" stroke-width="0.02">
    <path d="M0,1 A1,1 0 0 1 1,0 L2,1 Z"/>
    <path d="M2.5,1 A1,1 0 0 1 3.5,0 L4.5,1 Z"/>
    <rect x="0" y="3" width="1" height="1"/>
    <rect x="1" y="2" width="1" height="1"/>
    <rect x="0" y="1" width="1" height="1"/>
    <rect x="1" y="0" width="1" height="1"/>
    <rect x="2.5" y="3" width="1" height="1"/>
    <rect x="3.5" y="2" width="1" height="1"/>
    <rect x="2.5" y="1" width="1" height="1"/>
    <rect x="3.5" y="0" width="1" height="1"/>
  </svg>
</svg>
