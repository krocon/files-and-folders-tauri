<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Files and Folders</title>
  <defs>
    <!-- stark abgerundete Ecken -->
    <clipPath id="body">
      <rect x="75" y="75" width="874" height="874" rx="280" ry="280"/>
    </clipPath>
    <!-- Seiten: oben etwas heller, unten etwas dunkler – wirkt plastisch statt flach -->
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a7ff5"/>
      <stop offset="1" stop-color="#0058c7"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b9bff"/>
      <stop offset="1" stop-color="#0a74ea"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2f1ff"/>
      <stop offset="1" stop-color="#a8e3fc"/>
    </linearGradient>
    <!-- weicher Schatten unter dem Header-Balken -->
    <linearGradient id="headerShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001a40" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#001a40" stop-opacity="0"/>
    </linearGradient>
    <!-- leichter Schatten unter dem Logo -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="0.06" stdDeviation="0.06" flood-color="#001a40" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#body)">
    <!-- linke Seite -->
    <rect x="0" y="0" width="512" height="1024" fill="url(#left)"/>
    <!-- rechte Seite -->
    <rect x="512" y="0" width="512" height="1024" fill="url(#right)"/>
    <!-- Trennlinie zwischen den Seiten -->
    <rect x="508" y="260" width="8" height="764" fill="#003f99" opacity="0.35"/>
    <!-- Schatten unter dem Header -->
    <rect x="0" y="260" width="1024" height="28" fill="url(#headerShadow)"/>
    <!-- Header-Balken -->
    <rect x="0" y="0" width="1024" height="260" fill="url(#header)"/>
    <!-- feine Lichtkante oben im Header -->
    <rect x="0" y="75" width="1024" height="6" fill="#fff" opacity="0.6"/>
  </g>
  <!-- dünner Rand: hebt das Icon auf hellem und dunklem Grund ab -->
  <rect x="76" y="76" width="872" height="872" rx="279" ry="279"
        fill="none" stroke="#002a66" stroke-opacity="0.25" stroke-width="2"/>

  <!--
    „FF“-Logo aus docs/logo/ff-white.svg (4,5 × 4 Einheiten), je Buchstabe ein Pfad
    (keine Fugen zwischen den Teilen mehr, kein Hilfsrand nötig).
    Verschieben:  x, y      = linke obere Ecke in Pixeln
    Größe:        width, height im Verhältnis 4,5 : 4 lassen (z. B. 450 × 400, 360 × 320, 540 × 480)
    Mittig:       x = 512 − width / 2;  y = gewünschte Mitte − height / 2
    Jetzt: 450 × 400, mittig im blauen Teil (Mitte x 512, y 605).
  -->
  <svg x="287" y="405" width="450" height="400" viewBox="0 0 4.5 4" overflow="visible">
    <g fill="#d2f1ff" filter="url(#logoShadow)">
      <path d="M0,2 V1 A1,1 0 0 1 1,0 H2 V1 H1 V2 Z M1,2 H2 V3 H1 Z M0,3 H1 V4 H0 Z"/>
      <path d="M2.5,2 V1 A1,1 0 0 1 3.5,0 H4.5 V1 H3.5 V2 Z M3.5,2 H4.5 V3 H3.5 Z M2.5,3 H3.5 V4 H2.5 Z"/>
    </g>
  </svg>
</svg>
