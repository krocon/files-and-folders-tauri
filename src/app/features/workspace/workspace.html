@if (ws.ready()) {
  <app-file-panel side="left" />
  <div
    class="splitter"
    role="separator"
    tabindex="0"
    aria-orientation="vertical"
    aria-controls="fnf-pane-left"
    aria-valuemin="15"
    aria-valuemax="85"
    [attr.aria-valuenow]="splitPercent()"
    [attr.aria-label]="texts.splitter"
    [attr.title]="texts.splitter"
    (pointerdown)="onSplitterDown($event)"
    (pointermove)="onSplitterMove($event)"
    (pointerup)="onSplitterUp()"
    (pointercancel)="onSplitterUp()"
    (dblclick)="resetSplitter()"
    (keydown)="onSplitterKey($event)"
  ></div>
  <app-file-panel side="right" />
  <app-button-bar class="buttons" />
}

<div class="sr-only" aria-live="polite">{{ announcement() }}</div>

<!-- always rendered: a live region that appears together with its text is often not read -->
<div class="notices" role="status">
  @for (n of ws.notices(); track $index; let i = $index) {
    <div class="notice">
      <span>{{ n }}</span>
      <button type="button" class="btn" (click)="ws.dismissNotice(i)">{{ texts.dismiss }}</button>
    </div>
  }
</div>
