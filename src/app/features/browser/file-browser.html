<div class="toolbar">
  <button
    type="button"
    class="btn"
    (click)="store.up()"
    [disabled]="!store.canGoUp()"
    title="Go to parent folder (Backspace)"
  >
    <span aria-hidden="true">↑</span> Up
  </button>
  <button
    type="button"
    class="btn"
    (click)="store.refresh()"
    [disabled]="store.loading()"
    title="Reload folder"
  >
    <span aria-hidden="true">⟳</span> Refresh
  </button>
  <output class="path" [id]="pathId" [attr.title]="store.path()">
    {{ store.path() ?? '…' }}
  </output>
</div>

@if (errorText(); as text) {
  <div class="error" role="alert">
    <div>
      <strong>{{ text }}</strong>
      @if (store.error()?.path; as p) {
        <div class="error-path">{{ p }}</div>
      }
      <div class="error-detail">{{ store.error()?.message }}</div>
    </div>
    <button type="button" class="btn" (click)="store.dismissError()">Dismiss</button>
  </div>
}

<app-file-list [labelledBy]="pathId" />

<!-- no live region: the table announces folder changes; the cursor name would be read on every move -->
<footer class="status">
  @if (store.loading()) {
    <span>Loading…</span>
  } @else if (store.listing()) {
    <span>{{ status() }}</span>
  }
  @if (store.cursorEntry(); as cur) {
    <span class="selection" [attr.title]="cur.path">{{ cur.name }}</span>
  }
</footer>
