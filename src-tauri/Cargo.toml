[package]
name = "files-and-folders-tauri"
version = "0.1.0"
description = "Cross-platform dual-pane file manager (Tauri 2 + Angular)"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/files-and-folders-tauri"
edition = "2024"
rust-version = "1.93"

[lib]
name = "fnf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
flate2 = "1"
notify = "8.2"
open = "5"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# design 025 review #1/#2: unpack the 7z header ourselves (bounded) before sevenz-rust2 reads it
lzma-rust2 = { version = "0.23", default-features = false, features = ["std"] }
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["aes256", "bzip2", "compress", "ppmd"] }
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }
tauri = { version = "2.12.4", features = [] }
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
unrar-ng-sys = { version = "=0.7.7", optional = true }
zeroize = "1.9"
zip = { version = "9.0.5", default-features = false, features = ["aes-crypto", "deflate-flate2"] }

[features]
default = ["rar"]
# design 025 E2: RAR (read + extract) through the vendored UnRAR source (C++, unRAR licence – docs/licenses.md)
rar = ["dep:unrar-ng-sys"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# design 028 E4: GTK drag source on Linux (already in the tree through Tauri)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# design 028 E4: native drag source on macOS/Windows
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
drag = "2.1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
