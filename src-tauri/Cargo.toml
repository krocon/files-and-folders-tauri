[package]
name = "files-and-folders-tauri"
version = "0.1.0"
description = "Cross-platform dual-pane file manager (Tauri 2 + Angular)"
authors = ["krocon"]
license = ""
repository = "https://github.com/krocon/files-and-folders-tauri"
edition = "2024"
rust-version = "1.90"

[lib]
name = "fnf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
