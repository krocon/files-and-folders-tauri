[package]
name = "files-and-folders-tauri"
version = "1.0.0"
description = "Cross-platform dual-pane file manager (Tauri 2 + Angular)"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/files-and-folders-tauri"
edition = "2024"
rust-version = "1.93"

[lib]
name = "fnf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
flate2 = "1"
# design 036 E7: NFC keys for the folder comparison – already in the tree (url → idna)
icu_normalizer = "2.3"
notify = "8.2"
open = "5"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# design 025 review #1/#2 + re-check B1/B3: check the 7z header ourselves (CRCs, AES, bounded
# LZMA) before sevenz-rust2 reads it – aes/cbc/crc32fast are already in the tree (sevenz-rust2, zip)
aes = "0.9"
cbc = "0.2"
crc32fast = "1.5"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std"] }
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["aes256", "bzip2", "compress", "ppmd"] }
# design 042 E6: decoders for the similar-image search (pure Rust: zune-jpeg, png, gif, image-webp,
# tiff) – no system library; HEIC/AVIF are not supported on purpose
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
similar = { version = "2", default-features = false }
tar = { version = "0.4.46", default-features = false }
tauri = { version = "2.12.4", features = [] }
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
unrar-ng-sys = { version = "=0.7.7", optional = true }
zeroize = "1.9"
zip = { version = "9.0.5", default-features = false, features = ["aes-crypto", "deflate-flate2"] }
# design 034 E2: server connections – FTP/FTPS (sync, rustls with ring: no OpenSSL), SFTP in pure Rust,
# certificates checked by the OS, secrets only in the system keychain
suppaftp = { version = "12.2", default-features = false, features = ["rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
keyring-core = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "io-util", "macros"] }

[features]
default = ["rar"]
# design 025 E2: RAR (read + extract) through the vendored UnRAR source (C++, unRAR licence – docs/licenses.md)
rar = ["dep:unrar-ng-sys"]

[dev-dependencies]
tempfile = "3"
# design 034: in-process FTP(S) server for the tests
libunftp = "0.23"
unftp-sbe-fs = "0.4"
unftp-core = "0.1"
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# design 028 E4: GTK drag source on Linux (already in the tree through Tauri)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# design 034 E3: keychain of the OS (Secret Service over the dbus crate that is already in the tree)
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

# design 028 E4: native drag source on macOS/Windows
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
drag = "2.1.1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
