[package]
name = "files-and-folders-tauri"
version = "0.1.0"
description = "Cross-platform dual-pane file manager (Tauri 2 + Angular)"
authors = ["krocon"]
license = ""
repository = "https://github.com/krocon/files-and-folders-tauri"
edition = "2024"
rust-version = "1.90"

[lib]
name = "fnf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
notify = "8.2"
open = "5"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = [] }
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
