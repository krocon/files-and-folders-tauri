<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Files and Folders</title>
  <defs>
    <!-- stark abgerundete Ecken -->
    <clipPath id="body">
      <rect x="75" y="75" width="874" height="874" rx="280" ry="280"/>
    </clipPath>
  </defs>
  <g clip-path="url(#body)">
    <!-- linke Seite -->
    <rect x="0" y="0" width="512" height="1024" fill="#0070f0"/>
    <!-- rechte Seite -->
    <rect x="512" y="0" width="512" height="1024" fill="#007eff"/>
    <!-- Header-Balken -->
    <rect x="0" y="0" width="1024" height="260" fill="#a8e3fc"/>
  </g>
  <!-- schwarzes Quadrat, mittig (512 × 512) -->
  <!--rect x="256" y="300" width="512" height="424" fill="#000" rx="80" ry="80"/-->
  <!-- „FF“ als Pfade (keine Schrift nötig), Strichstärke 40, Höhe 240 -->
  <path fill="#fff" d="
    M320,392 h176 v40 h-136 v48 h112 v40 h-112 v112 h-40 Z
    M528,392 h176 v40 h-136 v48 h112 v40 h-112 v112 h-40 Z"/>
</svg>
