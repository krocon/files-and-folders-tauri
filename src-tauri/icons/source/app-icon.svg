<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Dual-Pane File Manager</title>
  <defs>
    <!-- 824×824 Körper, 100 px Rand, stark abgerundete Ecken -->
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="280" ry="280"/>
    </clipPath>
  </defs>
  <g clip-path="url(#body)">
    <!-- linke Seite -->
    <rect x="100" y="100" width="412" height="824" fill="#ff0a67"/>
    <!-- rechte Seite -->
    <rect x="512" y="100" width="412" height="824" fill="#007eff"/>
    <!-- Header-Balken -->
    <rect x="100" y="100" width="824" height="220" fill="#fe6c2a"/>
  </g>
</svg>
